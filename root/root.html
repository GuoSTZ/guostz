<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>guostz</title>
  <link rel="stylesheet" href="./root.css" />
  <script>
    // 当文档加载完成后执行  
    document.addEventListener('DOMContentLoaded', function () {
      // 为整个文档添加contextmenu事件监听器  
      document.addEventListener('contextmenu', function (event) {
        // 阻止默认行为（即不显示右键菜单）  
        event.preventDefault();
      });
    });  
  </script>
  <script src="./element.js"></script>
</head>

<body>
  <div id="app">
  </div>

  <script>
    function debounce(func, wait) {
      let timeout;
      return function () {
        const context = this, args = arguments;
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(context, args), wait);
      };
    }
  </script>

  <script>
    let leftButtonPressed = false;
    let rightButtonPressed = false;

    let preInfo = {};
    let currInfo = {};

    const app = document.getElementById('app');

    function createLink(node = {}) {
      const { text, href } = node;
      const link = document.createElement('a');
      link.textContent = text;
      link.href = href;
      return link;
    }

    function createMenuBlock() {
      const data = [
        { text: createLink({ text: '组件库', href: '/g-component' }) },
        { text: createLink({ text: '大屏', href: '/g-screen' }) },
      ];
      const mb = document.createElement('div');
      mb.innerHTML = `
        <style>
          @keyframes moveUp {  
            0% {  
              transform: translateY(0);
            }  
            100% {  
              transform: translateY(-100%);
              display: none;
            } 
          }  

          @keyframes moveDown {  
            0% {  
              transform: translateY(0);
            }  
            100% {  
              transform: translateY(100%);
              display: none;
            } 
          }
            
          .menu-block-icon {
            position: absolute;
            top: 50%;
            left: 0;
            width: 10px;
            height: 10px;
            background: #000;
            transform: translate(-50%, -50%) rotateZ(45deg);
          }

          .menu-block {
            position: relative;
            width: 100px;
            line-height: initial;
            background: #fff;
          }
            
          .menu-block::before {
            position: absolute;
            top: 0;
            left: 0;
            content: '';
            display: block;
            width: 100%;
            height: 50%;
            background: #fff;
            animation: moveUp 0.3s ease-in-out forwards;
          }

          .menu-block::after {
            position: absolute;
            bottom: 0;
            left: 0;
            content: '';
            display: block;
            width: 100%;
            height: 50%;
            background: #fff;
            animation: moveDown 0.3s ease-in-out forwards;
          }  
        </style>
        <div class="menu-block-icon"></div>
        <div class="menu-block"></div>
      `;
      const mbDiv = mb.querySelector('.menu-block');
      for(let i=0; i<data.length; i++) {
        const div = document.createElement('div');
        div.appendChild(data[i].text);
        mbDiv.appendChild(div);
      }
      return mb;
    }

    function createInteractiveBlock() {
      const ib = document.createElement('interactive-block');
      const mb = createMenuBlock();
      
      const div = document.createElement('div');
      div.textContent = '123';
      ib.data = [
        { text: '模块', children: mb },
        { text: '空', children: div },
        { text: '空', children: null },
        { text: '空', children: null },
        { text: '空', children: null },
      ];
      return ib;
    }

    function mouseMoveStart(e) {
      if (!preInfo.x && !preInfo.y) {
        preInfo = {
          x: e.clientX,
          y: e.clientY
        };
      };
      currInfo = {
        x: e.clientX,
        y: e.clientY
      };
    }

    function mouseMoveEnd() {
      const ib = document.querySelector('interactive-block');
      if(!!ib) {
        console.log('元素已经被创建，不再触发事件');
        return;
      }
      // 要求鼠标手势整体为向下滑动
      // 要求鼠标手势左右偏离不超过一定角度
      // 要求鼠标手势向下滑动超过100
      const isDown = currInfo.y - preInfo.y > 0;
      const isAngleDeviated = Math.abs(currInfo.y - preInfo.y) / Math.abs(currInfo.x - preInfo.x) > 1.4; // 略小于30度
      const isLength = currInfo.y - preInfo.y >= 100;

      if (isDown && isAngleDeviated && isLength) {
        // 在此处插入互动元素
        app.appendChild(createInteractiveBlock());
        // app.appendChild(createMenuBlock());
      }
      preInfo = {};
      currInfo = {};
    }

    function listenMouseDown() {
      const app = document.getElementById('app');

      app.addEventListener('mousedown', function (e) {
        if (e.button === 0) { // 左键  
          leftButtonPressed = true;
        } else if (e.button === 2) { // 右键  
          rightButtonPressed = true;
        }

        // 检查是否同时按下  
        if (leftButtonPressed && rightButtonPressed) {
          document.addEventListener('mousemove', mouseMoveStart);
        }
      });

      app.addEventListener('mouseup', function (e) {
        // 如果已经有鼠标被放开，那么就不往下执行了
        if (!leftButtonPressed || !rightButtonPressed) {
          return;
        }
        if (e.button === 0) {
          leftButtonPressed = false;
        } else if (e.button === 2) {
          rightButtonPressed = false;
        }
        document.removeEventListener('mousemove', mouseMoveStart);
        mouseMoveEnd();
      });
    }
    listenMouseDown();
  </script>

  <script>

  </script>
</body>

</html>
