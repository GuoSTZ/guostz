<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GUOSTZ</title>
  <style>
    :root {
      /* --bili: 0;
      --height: calc(100% / (1 + var(--bili)));
      --clip: calc(var(--bili) * 100%);
      --bottomHeight: calc(50% - var(--height) * (1 - var(--bili)) / 2);
      --bottomClip: calc(100% - var(--clip)); */
      --primary-color: #ffffff;
      --up-bg-color: #32363a;
    }

    html,
    body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;

      /**
        华文楷体：STKaiti
        华文仿宋：STFangsong
        標楷體：BiauKai
      */
      font-family: 'STKaiti', sans-serif;
    }

    /* 玻璃效果 */
    .common-glass {
      width: 200px;
      height: 200px;
      border-top: 1px solid rgba(255, 255, 255, 0.6);
      border-left: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 20px;

      color: #fff;

      backdrop-filter: blur(10px);
      box-shadow: 0 0 30px 10px rgba(255, 255, 255, 0.2);
      background: linear-gradient(to right bottom,
          rgba(255, 255, 255, 0.6),
          rgba(255, 255, 255, 0.4),
          rgba(255, 255, 255, 0.2),
        );
    }

    @keyframes line-rotate-up {
      0% {
        height: 100%;
        clip-path: polygon(0 0, 100% 0, 100% 0, 0 100%);
      }

      100% {
        height: 50%;
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
      }
    }

    @keyframes line-rotate-down {
      0% {
        top: 0;
        height: 100%;
        clip-path: polygon(0 100%, 100% 0, 100% 100%, 0 100%);
      }

      100% {
        top: 50%;
        height: 50%;
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
      }
    }

    @keyframes bg-up-leave {
      0% {
        top: 0;
        height: 50%;
      }

      100% {
        display: none;
        top: 0;
        height: 0;
      }
    }

    @keyframes bg-down-leave {
      0% {
        top: 50%;
        height: 50%;
      }

      100% {
        display: none;
        top: 100%;
        height: 0;
      }
    }

    @keyframes showup {
      0% {
        opacity: 0;
      }

      100% {
        opacity: 1;
      }
    }

    @keyframes text-leave {
      100% {
        display: none;
        transform: translate(100px, -80px) scale(1.2);

        filter: blur(15px) contrast(200%);
        opacity: 0;
      }
    }

    .first-container {
      position: relative;
      width: 100%;
      height: 100%;
      /* min-height: 150px; */
    }

    .first-container .bg {
      position: absolute;
      width: 100%;
    }

    .first-container .bg.up {
      top: 0;
      left: 0;

      background-color: var(--up-bg-color);

      animation: line-rotate-up 3s forwards;
    }

    .first-container .bg.down {
      left: 0;

      background-color: #ececec;

      animation: line-rotate-down 3s forwards;
    }

    .first-container .bg.up.bg-up-leave {
      animation: bg-up-leave 1s forwards;
    }

    .first-container .bg.down.bg-down-leave {
      animation: bg-down-leave 1s forwards;
    }

    .text-wrap {
      position: absolute;
      top: 50%;
      width: 100%;

      transform: translateY(-50%);

      mix-blend-mode: difference;

      animation: showup 3s forwards;
    }

    .text-leave {
      filter: url('#filter');
      cursor: pointer;
    }

    .text-leave #text {
      animation: text-leave 3s ease-out forwards;
    }

    #text {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;

      text-align: center;
      font-size: 70px;
      font-weight: bold;
      
      color: rgba(255, 255, 255, 0.8);
      text-shadow:
        0 0 10px rgba(255, 255, 255, 0.3),
        0 0 20px rgba(255, 255, 255, 0.3),
        2px 2px 2px rgba(0, 0, 0, 0.1);
      -webkit-text-stroke: 1px rgba(255, 255, 255, 0.3);
      
      cursor: pointer;
    }

    #text>span {
      display: block;
    }

    @keyframes rain {
      0% {
        transform: translateX(0);
      }

      70% {
        transform: translateY(190px);
      }

      100% {
        transform: translateY(190px);
      }
    }

    @keyframes author-show {
      0% {
        filter: blur(10px);
      }

      100% {
        letter-spacing: 0px;

        filter: blur(0px);
      }
    }

    .second-container {
      display: none;
      width: 100%;
      height: 100%;

      background: #000;
    }

    .second-container-layout {
      padding: 16px;
    }

    .info-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 60px;

      color: #fff;

      background: #000;
      filter: contrast(30);
    }

    .info-wrap .author {
      font-size: 30px;
      letter-spacing: -20px;

      animation: author-show 2s linear forwards;
    }

    .info-wrap .info {
      display: flex;
    }

    .info-wrap .info>div {
      outline: 1px solid lightskyblue;

      cursor: pointer;
    }

    .second-container-layout .second-container-content {
      display: flex;
      gap: 16px;
      padding-top: 16px;
    }

    .network-wrap {
      width: 300px;
      height: 330px;
      padding: 8px 16px 0;
    }

    .cloud-wrap {
      width: auto;
      height: 330px;
      padding: 8px 16px 0;

      -webkit-box-reflect: below 1px linear-gradient(transparent, transparent, transparent, transparent, #0005);
    }

    .cloud-wrap .cloud {
      position: relative;
      top: 70px;
      z-index: 100;
      width: 250px;
      height: 60px;
      border-radius: 100px;

      background-color: var(--primary-color);
      filter: drop-shadow(0 0 30px var(--primary-color));
    }

    .cloud-wrap .cloud::before {
      position: absolute;
      top: -40px;
      left: 40px;
      content: "";
      width: 70px;
      height: 70px;
      border-radius: 50%;

      background-color: var(--primary-color);
      box-shadow: 65px 0 0 28px var(--primary-color);
    }

    .cloud-wrap .cloud .cloud-text {
      position: absolute;
      top: 50px;
      height: 20px;

      line-height: 20px;
      text-transform: uppercase;
      transform-origin: bottom;

      color: var(--primary-color);
      text-shadow: 0 0 5px var(--primary-color), 0 0 15px var(--primary-color), 0 0 30px var(--primary-color);

      animation: rain 2s linear forwards;
    }

    .router-wrap {
      width: 300px;
      height: 330px;
      padding: 8px 16px 0;
    }

    .router-wrap .router>a {
      text-decoration: none;
      
      color: #fff;
    }
  </style>
</head>

<body>
  <div class="first-container">
    <div class="bg up"></div>
    <div class="bg down"></div>
    <div class="text-wrap">
      <div id="text"></div>
    </div>

    <svg width="0">
      <filter id="filter">
        <feTurbulence id="turbulence" type="fractalNoise" baseFrequency=".03" numOctaves="20" />
        <feDisplacementMap in="SourceGraphic" scale="30" />
      </filter>
    </svg>
  </div>

  <div class="second-container">
    <div class="second-container-layout">
      <div class="info-wrap">
        <div class="author">GUOSTZ</div>
        <div class="info">
          <div class="battery">电池</div>
          <div class="network">网络</div>
          <div class="address">地址</div>
        </div>
      </div>

      <div class="second-container-content">
        <div class="network-wrap common-glass">
          <div class="network">
            <div>
              <span>网络状态：</span>
              <span id="network-status"></span>
            </div>
            <div>
              <span>有效类型：</span>
              <span id="network-effectiveType"></span>
            </div>
            <div>
              <span>下行速度：</span>
              <span id="network-downlink"></span>
            </div>
          </div>
        </div>
        <div class="cloud-wrap common-glass">
          <div class="cloud"></div>
        </div>
        <div class="router-wrap common-glass">
          <div class="router">
            <a href="./g-components">组件库</a>
          </div>
          <div class="router">
            <a href="./g-app">微前端示例</a>
          </div>
          <div class="router">
            <a href="./g-bill">账单分摊</a>
          </div>
          <div class="router">
            <a href="./g-bill2">账单分摊2</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="./js/jinrishici.min.js" charset="UTF-8"></script>
  <script>
    (function () {
      'use strict';

      // 工具模块
      const Utils = {
        /**
         * 移除文本标点并分割为字符数组
         * @param {string} text 
         * @returns {string[]}
         */
        removePunctuationAndSplit(text) {
          const punctuationRegex = /[，。！？；：、“”‘’、\s\n\r\t\u3000\uff0c\uff0e\uff1f\uff01\uff1b\uff1a\u201c\u201d\u2018\u2019\uff08\uff09\u3001\u3002\u3010\u3011\uff5e\uff5c\u2027\u3002\uff61\uff62\u301c\u301d\u301e\u301f\uff01\uff1f\u203c\u2047\u2048\u2049\u300a\u300b\u3008\u3009\u300c\u300d\u300e\u300f\u3014\u3015\u2025\u2026\u2032\u2033\u2034\u2035\u2036\u2037\uff5e\u2018\u2019\u201c\u201d\u2014\u2013\uff0d\u2022\u201a\u201e\u2030\u2031\uff0e\uff5c\u2024\u202f\uff0c\uff01\u3001\uff1b\uff1a\u2026\u2025\u2022\u2027\u2574\u2575\u25cb\u25cf\u25b6\u25c0\u25d7\u25d8\u2660\u2663\u2665\u2666\u2713\u2717\u2720\u2721\u2736\u2737\u274c\u274e\u2757\u2776\u2777\u2795\u2796\u2797\u27b0\u27bf\uffe5\uff04\u3012\u301d\u301e\uff5e\uffe3]/g;
          return text.replace(punctuationRegex, '').split('');
        },

        /**
         * 获取范围内的随机整数
         */
        randomInt(max) {
          return Math.floor(Math.random() * max);
        }
      };

      // 应用主逻辑
      const App = {
        // 状态管理
        state: {
          texts: [], // 存储处理后的诗词字符
          rainTimer: null
        },

        // DOM 元素缓存
        dom: {},

        /**
         * 初始化入口
         */
        init() {
          this.cacheDOM();
          this.bindEvents();
          this.initFirstScreen();
          this.initSystemInfo();
        },

        /**
         * 缓存 DOM 元素
         */
        cacheDOM() {
          this.dom = {
            firstContainer: document.querySelector('.first-container'),
            secondContainer: document.querySelector('.second-container'),
            textWrap: document.querySelector('.text-wrap'),
            text: document.getElementById('text'),
            cloud: document.querySelector(".cloud"),
            bgUp: document.querySelector('.bg.up'),
            bgDown: document.querySelector('.bg.down'),
            networkStatus: document.querySelector('#network-status'),
            networkEffectiveType: document.querySelector('#network-effectiveType'),
            networkDownlink: document.querySelector('#network-downlink')
          };
        },

        /**
         * 绑定全局事件
         */
        bindEvents() {
          // 首页点击切换事件
          this.dom.textWrap.addEventListener('click', () => this.handleScreenTransition());

          // 网络状态监听
          window.addEventListener('online', () => this.updateNetworkUI(true));
          window.addEventListener('offline', () => this.updateNetworkUI(false));

          if (navigator.connection) {
            navigator.connection.addEventListener('change', (e) => this.updateConnectionInfo(e.target));
          }
        },

        /**
         * 第一屏初始化：获取诗词
         */
        initFirstScreen() {
          this.fetchPoetry();
          // 每30秒刷新一次诗词
          setInterval(() => this.fetchPoetry(), 30000);
        },

        /**
         * 获取并展示诗词
         */
        fetchPoetry() {
          if (typeof jinrishici === 'undefined') return;

          jinrishici.load((result) => {
            const fragment = document.createDocumentFragment();
            const content = result.data.content || '';

            // 创建逐字显示动画
            for (let i = 0; i < content.length; i++) {
              const span = document.createElement('span');
              span.innerText = content[i];
              // 错落有致的动画延迟
              span.style.animationDelay = `${1 + i / 10}s`;
              fragment.appendChild(span);
            }

            this.dom.text.innerHTML = '';
            this.dom.text.appendChild(fragment);

            // 缓存处理后的文本用于第二屏雨滴
            this.state.texts = Utils.removePunctuationAndSplit(result.data.origin.content.join(''));
          });
        },

        /**
         * 处理屏幕切换动画
         */
        handleScreenTransition() {
          // 添加离场动画类
          this.dom.bgUp.classList.add('bg-up-leave');
          this.dom.bgDown.classList.add('bg-down-leave');
          this.dom.textWrap.classList.add('text-leave');

          // 锁定第一屏防止滚动
          this.dom.firstContainer.style.overflow = 'hidden';
          document.body.style.background = '#000';

          // 动画结束后切换 DOM
          setTimeout(() => {
            this.dom.firstContainer.remove();
            this.dom.secondContainer.style.display = 'block';

            // 启动第二屏的文字雨
            this.startRainEffect();
          }, 3000);
        },

        /**
         * 启动文字雨效果
         */
        startRainEffect() {
          if (this.state.rainTimer) {
            clearInterval(this.state.rainTimer);
          }
          // 每 500ms 生成一个雨滴
          this.state.rainTimer = setInterval(() => this.createRainDrop(), 500);
        },

        /**
         * 创建单个文字雨滴
         */
        createRainDrop() {
          const texts = this.state.texts;
          if (!Array.isArray(texts) || texts.length === 0) return;

          const textEle = document.createElement("div");
          const text = texts[Utils.randomInt(texts.length)];

          textEle.innerText = text;
          textEle.classList.add("cloud-text");

          // 随机样式
          const left = Utils.randomInt(240);
          const size = Math.random() * 1.5;
          const duration = Math.random();

          Object.assign(textEle.style, {
            left: `${left}px`,
            fontSize: `${0.5 + size}em`,
            animationDuration: `${1 + duration}s`,
          });

          this.dom.cloud.appendChild(textEle);

          // 动画结束后移除元素，防止内存泄漏
          setTimeout(() => {
            if (textEle.parentNode) {
              textEle.parentNode.removeChild(textEle);
            }
          }, 10000);
        },

        /**
         * 初始化系统信息（网络、电池、硬件等）
         */
        initSystemInfo() {
          // 1. 网络信息
          this.updateNetworkUI(navigator.onLine);
          if (navigator.connection) {
            this.updateConnectionInfo(navigator.connection);
          }

          // 2. 电池信息
          if (navigator.getBattery) {
            navigator.getBattery().then(battery => {
              this.logBatteryInfo(battery);
              // 监听电池事件
              battery.onchargingchange = () => console.log("充电状态变化:", battery.charging);
              battery.onlevelchange = () => console.log("电量变化:", battery.level);
            });
          }

          // 3. 屏幕信息
          // for (let s in screen) { console.log(`${s}: ${screen[s]}`); }

          // 4. 显卡信息 (WebGL)
          this.logGPUInfo();
        },

        updateNetworkUI(isOnline) {
          if (this.dom.networkStatus) {
            this.dom.networkStatus.innerHTML = isOnline ? '在线' : '离线';
          }
        },

        updateConnectionInfo(connection) {
          if (this.dom.networkEffectiveType) {
            this.dom.networkEffectiveType.innerHTML = connection.effectiveType || 'unknown';
          }
          if (this.dom.networkDownlink) {
            this.dom.networkDownlink.innerHTML = connection.downlink || 0;
          }
        },

        logBatteryInfo(battery) {
          console.log("=== 电池信息 ===");
          console.log("是否在充电:", battery.charging);
          console.log("电量比例:", battery.level);
          console.log("充满剩余时间:", battery.chargingTime);
          console.log("耗尽剩余时间:", battery.dischargingTime);
        },

        logGPUInfo() {
          try {
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('experimental-webgl');
            if (!gl) return;

            const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
            if (debugInfo) {
              console.log("=== 显卡信息 ===");
              console.log("供应商:", gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL));
              console.log("渲染器:", gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL));
            }
          } catch (e) {
            console.warn("无法获取显卡信息", e);
          }
        }
      };

      // 启动应用
      App.init();
    })();
  </script>
</body>

</html>
